name: Generate Breakout Arcade Chart

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate-breakout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Breakout Arcade SVG
        uses: sontunght/arcade-contributions-action@v1.2.0
        with:
          github_user_name: Princeg0716
          game: breakout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync SVG Files
        run: |
          mkdir -p "ready to go"
          if [ -f "acrade-contributions breakout.svg" ]; then
            cp "acrade-contributions breakout.svg" "ready to go/acrade-contributions breakout.svg"
          fi

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add "acrade-contributions breakout.svg" "ready to go/acrade-contributions breakout.svg"
          git diff --quiet && git diff --staged --quiet || (git commit -m "🧱 Update Breakout Contribution Chart [skip ci]" && git push)
