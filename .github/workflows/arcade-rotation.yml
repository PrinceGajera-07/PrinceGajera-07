name: Rotate Arcade Contribution Chart

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  rotate-arcade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rotate Arcade Contribution SVG
        run: python .github/scripts/rotate_arcade.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add arcade-contribution.svg "ready to go/arcade-contribution.svg" acrade-contributions* "ready to go/acrade-contributions*" .github/arcade_index.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "🎮 Rotate Arcade Contribution Chart [skip ci]" && git push)
